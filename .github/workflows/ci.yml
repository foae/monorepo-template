name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      - name: go mod tidy is clean
        run: |
          before=$(cat go.mod go.sum | sha256sum)
          go mod tidy
          if [ "$before" != "$(cat go.mod go.sum | sha256sum)" ]; then
            echo "go mod tidy changed go.mod/go.sum; run it locally and commit"; git diff; exit 1
          fi

      - name: sqlc generated code is up to date
        run: sqlc diff -f services/example/storage/postgres/sqlc.yaml

  docker:
    name: Docker build (example)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/services/example/Dockerfile
          push: false
          tags: example:ci
